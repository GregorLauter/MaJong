[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "majong-calculator"
version = "0.1.0"
description = "Mah Jong: offline score calculator and settlement tracker."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.7,<7"]

[project.gui-scripts]
majong-desktop = "mahjong.gui:main"

[project.scripts]
majong = "mahjong.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pyinstaller>=6.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# Reject bool and int subclasses intentionally for hand-value validation.
ignore = ["E721"]

[tool.mypy]
# Current mypy supports 3.10+; CI also runs runtime tests on Python 3.9.
python_version = "3.10"
files = ["src", "tests", "majong.py"]
check_untyped_defs = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mahjong --cov-report=term-missing --cov-fail-under=95"

[tool.setuptools.package-data]
mahjong = ["assets/*.svg"]
