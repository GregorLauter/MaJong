name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    env:
      QT_QPA_PLATFORM: offscreen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install uv
        run: python -m pip install uv==0.9.26
      - name: Install project and development tools
        run: uv sync --locked --extra desktop --dev
      - name: Lint
        run: uv run --locked --extra desktop ruff check src/ tests/ majong.py
      - name: Check formatting
        run: uv run --locked --extra desktop ruff format --check src/ tests/ majong.py
      - name: Check types
        run: uv run --locked --extra desktop mypy
      - name: Test with coverage
        run: uv run --locked --extra desktop pytest
      - name: Build distribution
        run: uv build

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Test installed package
        run: python -m unittest discover -v
