name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish v0.1.0 after all platform builds pass (requires approval)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS-arm64
          - os: windows-latest
            label: Windows-x64
          - os: ubuntu-24.04
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Install uv
        run: python -m pip install uv==0.9.26
      - name: Install project
        run: uv sync --locked --extra desktop --dev
      - name: Test engine and desktop
        run: uv run --locked --extra desktop pytest
      - name: Build standalone app
        run: uv run --locked --extra desktop pyinstaller --noconfirm packaging/majong.spec
      - name: Smoke-test packaged app
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            "dist/Mah Jong.app/Contents/MacOS/Mah Jong" --smoke-test
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            "dist/Mah Jong/Mah Jong.exe" --smoke-test
          else
            "dist/Mah Jong/Mah Jong" --smoke-test
          fi
      - name: Archive macOS app preserving bundle permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Mah Jong.app" dist/Mah-Jong-macOS-arm64.zip
      - name: Archive Linux app preserving executable permissions
        if: runner.os == 'Linux'
        run: tar -czf dist/Mah-Jong-Linux-x64.tar.gz -C dist "Mah Jong"
      - name: Archive Windows app
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist/Mah Jong" -DestinationPath dist/Mah-Jong-Windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Mah-Jong-${{ matrix.label }}
          path: |
            dist/Mah-Jong-*.zip
            dist/Mah-Jong-*.tar.gz
          if-no-files-found: error

  rulebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v7
        with:
          name: Mah-Jong-rulebook
          path: output/pdf/Mah-Jong-rules.pdf
          if-no-files-found: error

  release:
    if: inputs.publish
    needs: [package, rulebook]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: Mah-Jong-*
          merge-multiple: true
          path: release-assets
      - name: Publish the approved release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            release-assets/Mah-Jong-Windows-x64.zip
            release-assets/Mah-Jong-macOS-arm64.zip
            release-assets/Mah-Jong-Linux-x64.tar.gz
            release-assets/Mah-Jong-rules.pdf
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done
          gh release create v0.1.0 "${assets[@]}" \
            --target "$GITHUB_SHA" --title "Mah Jong 0.1.0" \
            --notes-file docs/release-notes.md --draft
          gh release edit v0.1.0 --draft=false --latest
